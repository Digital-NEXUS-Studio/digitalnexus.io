<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening LienShield on Google Play…</title>
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="2;url=https://play.google.com/store/apps/details?id=com.lienshield.nexus&amp;referrer=utm_source%3Ddirect%26utm_medium%3Dsocial%26utm_campaign%3Dw01">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .card { max-width: 380px; padding: 28px; border-radius: 16px; background: #12161f; border: 1px solid #1e2638; text-align: center; }
    .btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 10px; background: #0284c7; color: #fff; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 12px; color: #94a3b8; font-size: 12px; }
  </style>
  <script>
    (function () {
      var SRC = { tt: "tiktok", ig: "instagram", yt: "youtube", x: "x", th: "threads", fb: "facebook", li: "linkedin", rd: "reddit", web: "website" };
      var p = new URLSearchParams(window.location.search);
      var raw = (p.get("s") || "direct").toLowerCase();
      var src = SRC[raw] || raw.replace(/[^a-z0-9_-]/g, "") || "direct";
      var camp = (p.get("c") || "w01").replace(/[^a-zA-Z0-9_-]/g, "") || "w01";
      var ref = "utm_source=" + src + "&utm_medium=social&utm_campaign=" + camp;
      var dest = "https://play.google.com/store/apps/details?id=com.lienshield.nexus&referrer=" + encodeURIComponent(ref);
      try {
        if (navigator.sendBeacon && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
          var payload = JSON.stringify({ app: "lienshield", source: src, campaign: camp, raw_s: raw, referer: document.referrer || "" });
          navigator.sendBeacon("https://console.digitalnexus.studio/api/click", new Blob([payload], { type: "application/json" }));
        }
      } catch (_) {}
      window.addEventListener("DOMContentLoaded", function () {
        var a = document.getElementById("play-link");
        if (a) a.href = dest;
      });
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h2>Opening LienShield…</h2>
    <p>Taking you to Google Play Store.</p>
    <a id="play-link" class="btn" href="https://play.google.com/store/apps/details?id=com.lienshield.nexus">Open Google Play</a>
    <small>Digital NEXUS &middot; Direct Attribution Link</small>
  </div>
</body>
</html>
