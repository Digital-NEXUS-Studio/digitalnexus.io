<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Kaiju Week</title>
    <!--
      Fonts, self-hosted, the same five faces as the play page: Montserrat
      700/800 for titles, Barlow for everything else. See index.html for why
      they are not fetched from a font service, and public/fonts/OFL.txt and
      public/fonts/OFL-Montserrat.txt for their licences.
    -->
    <style>
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(./fonts/7cHpv4kjgoGqM7E_DMs5.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(./fonts/7cHqv4kjgoGqM7E3_-gs51os.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(./fonts/7cHqv4kjgoGqM7E30-8s51os.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(./fonts/montserrat-latin-700-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url(./fonts/montserrat-latin-800-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <style>
      /*
       * ── The event bay ─────────────────────────────────────────────────────
       *
       * Kaiju Week keeps its dark hangar — the colossus is lit for a night
       * shift in a closed room, and its chrome is written for that — so its
       * palette is the sky theme's night side rather than its day side: the
       * ground is the key art's navy ink, the accent is the frame's light
       * cyan, and the titles are in the same Montserrat as the play page. Same
       * game, bigger room; a chrome that announced itself as a different
       * product would read as a different app.
       *
       * Amber earns its place by being the one thing on screen that is
       * machinery rather than interface — the gantry, its height readout, the
       * hour hand. The crowd's names are a desaturated blue so that at a glance
       * the screen says: cyan is you, amber is the crane, grey-blue is everyone
       * else. Every text colour here is at least 5:1 on the navy ground.
       */
      :root {
        --bay-0: #0a2e4d;        /* --ink on the play page: the night side of the sky */
        --bay-1: #0b1017;
        --bay-2: #121a24;
        --bay-3: #1d2733;
        --line: #2a4661;
        --line-soft: #1b3047;
        --text: #eef6fb;
        --muted: #9fb4c8;
        --accent: #80dff1;       /* the key art's frame cyan */
        --accent-dim: #4bcbe4;
        --amber: #f0b429;
        --amber-dim: #7a5c17;
        --warn: #ff6b6b;
        --ok: #5fe3a1;
        --display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
        --body: 'Barlow', system-ui, sans-serif;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bay-0);
        color: var(--text);
        font-family: var(--body);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .app { position: relative; height: 100%; }
      #stage { position: absolute; inset: 0; touch-action: none; }
      #stage canvas { display: block; width: 100%; height: 100%; }

      /* ── The header ──────────────────────────────────────────────────────
       *
       * Everything the event is: whose week it is, what hour it is, how much
       * of the giant is up, and whether it can still be finished. The last of
       * those is the one that matters and it is the one in words — a player
       * who is going to lose the week should be told in a sentence while
       * there is still time to hurry, not left to work it out from two
       * fractions.
       */
      #top {
        position: absolute;
        top: 0; left: 0; right: 0;
        padding: calc(env(safe-area-inset-top) + 10px) 12px 8px;
        background: linear-gradient(to bottom, rgba(5, 8, 12, 0.94) 60%, rgba(5, 8, 12, 0));
        pointer-events: none;
        z-index: 4;
      }
      .row {
        display: flex; align-items: baseline; gap: 10px;
        font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase;
      }
      #event { font-size: 15px; font-weight: 700; color: var(--accent); }
      /* One line, always. Wrapped, it pushed the stats row under the claim
         strip and two readouts shared the same twenty pixels. */
      #machine {
        font-size: 12px; color: var(--muted); flex: 1; letter-spacing: 0.14em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      #clock { font-family: var(--mono); font-size: 13px; color: var(--amber); }
      #clock b { font-family: var(--display); letter-spacing: 0.16em; margin-right: 6px; }

      /* The week as a bar, with Saturday marked. The mark is the whole point:
         the escalation starts there, and a player who can see it coming can
         decide to leave the crown plate for the money. */
      #week {
        position: relative; height: 4px; margin: 8px 0 7px;
        background: var(--line-soft); border-radius: 2px; overflow: hidden;
      }
      #week-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); }
      #week-sat {
        position: absolute; top: -3px; bottom: -3px; width: 2px;
        background: var(--accent-dim);
      }

      #stats { display: flex; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
      #stats b { color: var(--text); font-weight: 600; }
      #outlook { margin-left: auto; letter-spacing: 0.1em; text-transform: uppercase; }
      #outlook[data-tone='comfortable'] { color: var(--ok); }
      #outlook[data-tone='tight'] { color: var(--amber); }
      #outlook[data-tone='lost'] { color: var(--warn); }

      /* ── The claim strip ─────────────────────────────────────────────────
       *
       * Your ten panels, as chips, in height order. Tapping one claims it, and
       * a claimed panel is the one the socket lights for. It scrolls
       * horizontally because ten chips do not fit across a phone and a wrapped
       * grid would eat a third of the screen — and because the order is
       * meaningful, so scrolling through it is reading up the giant.
       */
      #claims {
        position: absolute; left: 0; right: 0;
        display: flex; gap: 6px; padding: 0 12px;
        overflow-x: auto; overflow-y: hidden;
        scrollbar-width: none;
        z-index: 4;
      }
      #claims::-webkit-scrollbar { display: none; }
      /* The [hidden] attribute loses to an author `display`, so both of the
         flex containers the ending takes away need it said explicitly. */
      #claims[hidden] { display: none; }
      .chip {
        flex: 0 0 auto;
        min-width: 92px;
        padding: 6px 9px 7px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(11, 16, 23, 0.9);
        font-family: var(--display);
        text-align: left;
        color: var(--muted);
        cursor: pointer;
      }
      .chip .where { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
      .chip .what { display: block; font-size: 12px; color: var(--text); line-height: 1.15; }
      .chip .pay { display: block; font-family: var(--mono); font-size: 10px; color: var(--amber); }
      .chip[data-state='claimed'] { border-color: var(--accent); background: rgba(20, 44, 62, 0.95); }
      .chip[data-state='claimed'] .where { color: var(--accent); }
      .chip[data-state='done'] { opacity: 0.4; }
      .chip[data-state='done'] .pay { color: var(--ok); }
      .chip .rise { color: var(--amber); font-weight: 700; }

      /* ── The crane ───────────────────────────────────────────────────────
       *
       * The one control the mode adds, and it is on the right edge where a
       * right thumb rests. It is tall because its whole job is to be coarse
       * and fine at once — the deck and the crown are a thumb apart, and a
       * single panel is about four pixels of travel.
       */
      #crane {
        position: absolute; right: 8px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        z-index: 5;
      }
      #crane[hidden] { display: none; }
      #crane-read {
        font-family: var(--mono); font-size: 11px; color: var(--amber);
        background: rgba(5, 8, 12, 0.8); padding: 3px 6px; border-radius: 6px;
        white-space: nowrap;
      }
      #crane-slider {
        writing-mode: vertical-lr;
        direction: rtl;
        -webkit-appearance: slider-vertical;
        appearance: slider-vertical;
        width: 34px;
        accent-color: var(--amber);
        touch-action: none;
        background: transparent;
      }
      #crane-tier {
        font-family: var(--display); font-size: 10px; letter-spacing: 0.14em;
        color: var(--muted); text-transform: uppercase;
      }

      /* ── Socket pips ─────────────────────────────────────────────────────
       *
       * One marker per open socket, projected every frame. A socket off the
       * top or the bottom of the screen is pinned to the edge with the climb
       * it needs, which is the only way a player knows the crane has anywhere
       * to go. This is the mode's compass.
       */
      #pips { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      .pip {
        position: absolute;
        transform: translate(-50%, -50%);
        font-family: var(--display); font-size: 10px; letter-spacing: 0.1em;
        text-transform: uppercase; white-space: nowrap;
        padding: 2px 6px; border-radius: 8px;
        border: 1px solid var(--accent-dim); color: var(--accent);
        background: rgba(5, 8, 12, 0.7);
      }
      .pip[data-who='crowd'] {
        border-color: rgba(126, 139, 156, 0.5); color: var(--muted);
        font-size: 9px; padding: 1px 4px;
      }
      .pip[data-who='claimed'] {
        border-color: var(--accent); color: #eaf7ff;
        box-shadow: 0 0 12px rgba(79, 195, 255, 0.45);
      }
      .pip[data-off='1'] { opacity: 0.85; }

      /* ── The dock ────────────────────────────────────────────────────────*/
      #dock {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
        background: linear-gradient(to top, rgba(5, 8, 12, 0.94) 55%, rgba(5, 8, 12, 0));
        pointer-events: none;
        z-index: 4;
        text-align: center;
      }
      #front-name {
        font-family: var(--display); font-size: 13px; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--muted); min-height: 16px;
      }
      #socket {
        font-family: var(--display); font-size: 12px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--accent); min-height: 15px;
      }

      #message {
        position: absolute; left: 12px; right: 56px;
        font-family: var(--body); font-size: 13px; line-height: 1.3;
        text-align: center; color: var(--text); z-index: 5;
        pointer-events: none; opacity: 0; transition: opacity 0.18s;
      }
      #message[data-show='1'] { opacity: 1; }
      #message[data-tone='no'] { color: var(--warn); }
      #message[data-tone='ok'] { color: var(--ok); }

      /* The inspector: tap a panel on the crate to look at it and turn it. */
      #inspect {
        position: absolute; inset: 0; z-index: 6; touch-action: none;
        background: radial-gradient(circle at 50% 42%, rgba(9, 18, 28, 0.55), rgba(5, 8, 12, 0.88));
      }
      #inspect[hidden] { display: none; }
      #inspect-name {
        position: absolute; left: 0; right: 0; top: 22%;
        text-align: center; font-family: var(--display); font-size: 16px;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--text);
      }
      #inspect-hint {
        position: absolute; left: 0; right: 0; bottom: 16%;
        text-align: center; font-size: 12px; color: var(--muted);
      }
      #inspect-square {
        position: absolute; left: 0; right: 0; top: 26%;
        text-align: center; font-family: var(--mono); font-size: 12px;
        letter-spacing: 0.2em; color: var(--ok);
      }
      #inspect-square[hidden] { display: none; }

      /* ── Loading, and the two endings ────────────────────────────────────*/
      #curtain {
        position: absolute; inset: 0; z-index: 8;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: var(--bay-0); text-align: center; padding: 24px;
      }
      #curtain[hidden] { display: none; }
      #curtain h1 {
        margin: 0; font-family: var(--display); font-size: 28px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
      }
      #curtain p { margin: 0; max-width: 30ch; color: var(--muted); font-size: 13px; line-height: 1.5; }
      #curtain-bar { width: 200px; height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
      #curtain-fill { height: 100%; width: 0; background: var(--accent); }
      /*
       * The curtain when the machine that was asked for cannot be a colossus.
       *
       * It stays the load screen — the player asked for a giant and this is
       * where a giant would have appeared — and changes only the width of its
       * line and the colour of its bar. The bar goes red and FULL rather than
       * vanishing, because a bar sitting at nothing reads as "still working",
       * which is the exact impression this replaced.
       */
      #curtain[data-blocked] p { max-width: 44ch; color: var(--text); }
      #curtain[data-blocked] #curtain-fill { background: var(--warn); }

      #ending {
        position: absolute; inset: auto 0 0; z-index: 7;
        padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px);
        background: linear-gradient(to top, rgba(5, 8, 12, 0.97) 65%, rgba(5, 8, 12, 0));
        text-align: center;
      }
      #ending[hidden] { display: none; }
      #ending h2 {
        margin: 0 0 6px; font-family: var(--display); font-size: 24px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
      }
      #ending[data-outcome='stands'] h2 { color: var(--ok); }
      #ending[data-outcome='lost'] h2 { color: var(--warn); }
      #ending p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      #ending dl {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        margin: 0 0 14px; font-family: var(--mono);
      }
      #ending dt { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
      #ending dd { margin: 2px 0 0; font-size: 18px; color: var(--text); }
      #ending button {
        appearance: none; border: 1px solid var(--accent); background: transparent;
        color: var(--accent); font-family: var(--display); font-size: 13px;
        letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 26px;
        border-radius: 10px; cursor: pointer;
      }
    </style>
    <script type="module" crossorigin src="./assets/kaiju-E3HIzKrp.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-vendor-CuvZfx6h.js">
    <link rel="modulepreload" crossorigin href="./assets/sound-pZfq9lul.js">
  </head>
  <body>
    <div class="app">
      <div id="stage"></div>

      <header id="top">
        <div class="row">
          <span id="event">Kaiju Week</span>
          <span id="machine"></span>
          <span id="clock"><b id="day">Mon</b><span id="hh">00:00</span></span>
        </div>
        <div id="week"><i id="week-fill"></i><u id="week-sat"></u></div>
        <div id="stats">
          <span>Giant <b id="stat-panels">0/0</b></span>
          <span>Yours <b id="stat-mine">0/0</b></span>
          <span>Paid <b id="stat-credits">0</b></span>
          <span id="outlook" data-tone="comfortable"></span>
        </div>
      </header>

      <div id="claims"></div>
      <div id="pips"></div>

      <aside id="crane">
        <span id="crane-read">0 m</span>
        <input id="crane-slider" type="range" min="0" max="1000" step="1" value="0" aria-label="Crane height" />
        <span id="crane-tier">Deck</span>
      </aside>

      <div id="message"></div>

      <footer id="dock">
        <div id="socket"></div>
        <div id="front-name"></div>
      </footer>

      <div id="inspect" hidden>
        <div id="inspect-name"></div>
        <div id="inspect-square" hidden>Square</div>
        <div id="inspect-hint">Drag to turn it · pull it out to fit it</div>
      </div>

      <div id="ending" hidden>
        <h2 id="ending-title"></h2>
        <p id="ending-line"></p>
        <dl>
          <div><dt>Your panels</dt><dd id="ending-mine">0</dd></div>
          <div><dt>Crew</dt><dd id="ending-crew">0</dd></div>
          <div><dt>Credits</dt><dd id="ending-credits">0</dd></div>
        </dl>
        <button id="ending-again" type="button">Run it again</button>
      </div>

      <div id="curtain">
        <h1>Kaiju Week</h1>
        <p id="curtain-line">Raising the colossus…</p>
        <div id="curtain-bar"><i id="curtain-fill"></i></div>
      </div>
    </div>
  </body>
</html>
